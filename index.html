<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Final Project | Module 5</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img
            id="personal-logo"
            src="./assets/blinker-icon.png"
            alt="blinker company logo"
          />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Find Your Car</a
            >
          </li>
          <li class="nav__link--button">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
      <section>
        <h1>Welcome to Our Movie Finder</h1>
        <h2>Discover the perfect movie for your needs!</h2>
      </section>
      <section id="search-section">
        <input
          type="text"
          id="search-input"
          placeholder="Search for movies..."
        />
        <button id="search-button" onclick="fetchMovies()">Search</button>
        <div id="loading" style="display: none">Loading...</div>
        <div id="results"></div>
      </section>
    </section>
  </body>
</html>
