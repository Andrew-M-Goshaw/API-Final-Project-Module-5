<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Final Project | Module 5</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <div class="burger-menu" id="burgerMenu">
          <i class="fas fa-bars"></i>
        </div>
        <figure>
          <img
            id="personal-logo"
            src="./assets/blinker-icon.png"
            alt="blinker company logo"
          />
        </figure>
        <ul class="nav__link--list" id="navLinks">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Home</a
            >
          </li>
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Find Your Movie</a
            >
          </li>
          <li class="nav__link--button">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
      <section>
        <h1>Welcome to Our Movie Finder</h1>
        <h2>Discover the perfect movie for your needs!</h2>
      </section>
      <section id="search-section">
        <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search for movies..."
        />
        <button id="search-button" onclick="fetchMovies()">Search</button>
        <div class="movie" id="loading" style="display: none">Loading...</div>
        <main>
          <label for="yearRange">Select Release Year Range:</label>
          <input type="range" id="yearRange" min="1900" max="2026" value="2026" />
          <span id="yearValue">2026</span>
        </div>
          <div id="results"></div>
          <div id="movieList"></div>
      </section>
    </section>
    </main>
  </body>
</html>
